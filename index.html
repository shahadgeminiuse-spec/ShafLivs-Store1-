function normalizeProduct(p){
  const vars=(p.product_variants||[]).filter(v=>v.is_active!==false).map(v=>({...v,stock_quantity:Number(v.stock_levels?.[0]?.quantity ?? v.stock_levels?.quantity ?? 0),purchase_cost:Number(v.variant_costs?.[0]?.purchase_cost ?? 0)}));
  // Use a priced variant for the storefront's "from" price; never show ₹0
  // merely because the first variant is incomplete.
  const priced=vars.filter(v=>Number(v.selling_price)>0).sort((a,b)=>Number(a.selling_price)-Number(b.selling_price));
  const first=priced[0]||vars[0]||{};
  const images=(p.product_images||[]).filter(x=>x.image_url).sort((a,b)=>(Number(b.is_primary)-Number(a.is_primary))||Number(a.position||0)-Number(b.position||0));
  return {...p,product_name:p.name,category:p.categories?.name||'',price:Number(first.selling_price||0),compare_at_price:Number(first.mrp||0),cost_price:Number(first.purchase_cost||0),stock_quantity:vars.reduce((n,v)=>n+Number(v.stock_quantity||0),0),sku:first.sku||'',sizes:[...new Set(vars.map(v=>v.size).filter(Boolean))].join(','),colors:[...new Set(vars.map(v=>v.color).filter(Boolean))].join(','),image_url:images[0]?.image_url||'',variant_id:first.id||null,variants:vars};
}
async function fetchNormalizedProducts(activeOnly=false){
 const variantSelect=activeOnly?'id,sku,barcode,size,color,selling_price,mrp,gst_rate,hsn_code,is_active,stock_levels(quantity)':'id,sku,barcode,size,color,selling_price,mrp,gst_rate,hsn_code,is_active,variant_costs(purchase_cost,minimum_selling_price),stock_levels(quantity)';
 const q=db.from('products').select(`*,categories(name),product_variants(${variantSelect}),product_images(image_url,is_primary,position),product_details(highlights,fabric,wash_care),product_showcase_videos(id,video_url,poster_url,duration_seconds,position)`).order('created_at',{ascending:false});
 if(activeOnly) q.eq('status','active');
 const {data,error}=await q;
 if(error) throw error;
 const normalized=(data||[]).map(p=>({...p,product_variants:(p.product_variants||[]).map(v=>({...v,stock_levels:Array.isArray(v.stock_levels)?v.stock_levels:(v.stock_levels?[v.stock_levels]:[{quantity:0}])}))})).map(normalizeProduct);
 return activeOnly ? normalized.filter(p=>p.variants.some(v=>Number(v.selling_price)>0)) : normalized;
}
async function loadProducts() {
  const grid = document.getElementById("productGrid");
  const count = document.getElementById("productCount");

  try {
    products = await window.fetchNormalizedProducts(true);

    renderCategoryChips();
    renderStyleTiles();
    renderProducts();

    const sync = document.getElementById("inventorySync");
    if (sync) sync.textContent = "● Live inventory connected";

  } catch (e) {
    const sync = document.getElementById("inventorySync");
    if (sync) sync.textContent = "● Inventory connection issue";

    if (count) {
      count.textContent = "Load error: " + (e?.message || String(e));
    }

    if (grid) {
      grid.innerHTML = `
        <div class="empty">
          We couldn't load the live inventory.<br>
          <small>${esc(e?.message || String(e))}</small><br>
          <button class="btn outline"
            style="margin-top:12px"
            onclick="loadProducts()">Try again</button>
        </div>`;
    }
  }
}

function shopLivsAllocateComboAdjustment(orders,items){
 const orderMap=new Map((orders||[]).map(o=>[o.id,o]));
 const grouped=new Map();(items||[]).forEach(i=>{if(!grouped.has(i.order_id))grouped.set(i.order_id,[]);grouped.get(i.order_id).push(i);});
 const output=[];
 for(const [orderId,lines] of grouped){const order=orderMap.get(orderId)||{},raw=order.notes,note=typeof raw==='string'?(()=>{try{return JSON.parse(raw)}catch{return {}}})():(raw||{}),comboIds=new Set((note.combo_sales||[]).flatMap(c=>(c.components||[]).map(x=>x.variant_id))),net=Number(order.combo_discount_amount||0)-Number(order.combo_adjustment_amount||0),comboLines=comboIds.size?lines.filter(x=>comboIds.has(x.variant_id)):(net!==0?lines:[]),base=comboLines.reduce((n,x)=>n+Number(x.line_total||0),0);
  for(const line of lines){const inCombo=comboLines.includes(line),share=inCombo&&base>0?net*(Number(line.line_total||0)/base):0;output.push({...line,realized_line_total:Math.max(0,Number(line.line_total||0)-share)});}
 }
 return output;
}

 finally{aiChatBusy=false;const chatHost=document.getElementById('aiChatMessages');if(chatHost){chatHost.innerHTML=aiChatMessages.map(m=>`<div class="ai-chat-bubble ${m.role==='user'?'user':'assistant'}">${esc(m.content)}</div>`).join('');chatHost.scrollTop=chatHost.scrollHeight;}const input2=document.getElementById('aiChatInput');if(input2){input2.disabled=false;input2.value='';input2.focus();}const btn=document.querySelector('.ai-chat-compose button');if(btn){btn.disabled=false;btn.textContent='Send ➤';}const st=document.getElementById('aiChatStatus');if(st)st.textContent=aiChatMessages[aiChatMessages.length-1]?.content?.startsWith('I hit a connection issue')?'Connection issue — you can switch provider and retry.':'Ready when you are · Mode: '+(aiChatMode==='council'?'Multi-AI Council':'Business Partner')+'.';}
}

}

const RPA_LOCAL_KEY='shaflivs_rpa_local_metrics_v1';
const rpaNum=v=>{const n=Number(String(v??'').replace(/[,\s₹]/g,''));return Number.isFinite(n)&&n>0?Math.round(n*100)/100:0;};
const rpaPct=(a,b)=>b>0?(a/b*100):0;
const rpaFmt=n=>Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0});
const rpaP=n=>(Number(n)||0).toFixed(1)+'%';
function rpaLocalGet(){try{return JSON.parse(localStorage.getItem(RPA_LOCAL_KEY)||'{}')||{};}catch(e){return {};}}
function rpaLocalSet(o){try{localStorage.setItem(RPA_LOCAL_KEY,JSON.stringify(o));}catch(e){}}

 root.innerHTML=adminHead('Reels Performance Analyst','<button class="btn outline" onclick="renderReelGenerator(adminRoot())">↻ Refresh</button>')+

async function rpaLoad(){
 const host=document.getElementById('rpaBody');if(!host)return;
 try{
  const [posts,ins,ev,prods]=await Promise.all([
   db.from('social_posts').select('id,product_id,caption,platforms,status,scheduled_at,created_at,tracking_code').order('created_at',{ascending:false}).limit(500),
   db.from('social_post_insights').select('post_id,views,reach,impressions,likes,comments,shares,saves,clicks,captured_at').order('captured_at',{ascending:false}).limit(2000),
   db.from('social_attribution_events').select('post_id,event_type,revenue,metadata,created_at').limit(5000),
   db.from('products').select('id,name').order('name').limit(500)
  ]);
  if(posts.error)throw posts.error;if(ev.error)throw ev.error;
  window.__rpa={posts:posts.data||[],ins:ins.error?[]:(ins.data||[]),ev:ev.data||[],prods:prods.error?[]:(prods.data||[]),insErr:ins.error};
  rpaRender();
 }catch(e){host.innerHTML='<section class="panel"><p class="danger">Could not load Reel data: '+safeErr(e)+'</p></section>';}
}

function rpaRows(){
 const s=window.__rpa,local=rpaLocalGet(),pn={};(s.prods||[]).forEach(p=>pn[p.id]=p.name);
 const latest={};
 (s.ins||[]).forEach(i=>{if(i.post_id&&!latest[i.post_id])latest[i.post_id]=i;}); // newest first
 return (s.posts||[]).filter(p=>(p.tracking_code||'').startsWith('RL-')||latest[p.id]||local[p.id]).map(p=>{
  const m=latest[p.id]||local[p.id]||{};
  const views=+m.views||0,reach=+m.reach||0,likes=+m.likes||0,comments=+m.comments||0,shares=+m.shares||0,saves=+m.saves||0;
  let enq=0,sales=0,rev=0;
  (s.ev||[]).filter(e=>e.post_id===p.id).forEach(e=>{const c=Number(e.metadata?.count)||1;if(e.event_type==='enquiry'||e.event_type==='lead')enq+=c;if(e.event_type==='order'){sales+=c;rev+=Number(e.revenue)||0;}});
  const inter=likes+comments+shares+saves;
  const when=p.scheduled_at||p.created_at;const d=new Date(when);
  const ist=new Date(d.getTime()+330*60000);
  return {id:p.id,title:(p.caption||'Reel').slice(0,80),product:pn[p.product_id]||'—',platform:(p.platforms||[])[0]||'instagram',when,
   day:ist.getUTCDay(),hour:ist.getUTCHours(),views,reach,likes,comments,shares,saves,inter,enq,sales,rev,
   er:rpaPct(inter,reach||views),saveRate:rpaPct(saves,reach||views),shareRate:rpaPct(shares,reach||views),
   enqRate:rpaPct(enq,views),conv:rpaPct(sales,enq),local:!!(!latest[p.id]&&local[p.id])};
 });
}

 const host=document.getElementById('rpaBody');if(!host)return;
 const s=window.__rpa,rows=rpaRows();
 const T=k=>rows.reduce((a,r)=>a+r[k],0);
 const tv=T('views'),tr=T('reach'),ti=T('inter'),te=T('enq'),ts=T('sales'),trev=T('rev');
 const needMig=s.insErr||rows.some(r=>r.local);
 const stats=[['Reels tracked',rows.length],['Total views',rpaFmt(tv)],['Total reach',rpaFmt(tr)],['Engagement rate',rpaP(rpaPct(ti,tr||tv))],['Enquiries',rpaFmt(te)],['Sales / revenue',rpaFmt(ts)+' · '+money(trev)]]
  .map(x=>'<div class="stat"><small>'+x[0]+'</small><strong style="font-size:20px">'+esc(x[1])+'</strong></div>').join('');

 const form='<section class="panel"><h3 style="margin-top:0">Add / update Reel data</h3><p class="muted">Copy the numbers from Instagram / Facebook Insights. Enter the same Reel title again later to add a fresh snapshot.</p>'+
  '<div class="admin-form"><div class="field full"><label for="rpaTitle">Reel title / hook *</label><input id="rpaTitle" placeholder="e.g. Kerala cotton saree — 20s showcase"></div>'+
  '<div class="field"><label for="rpaProd">Product</label><select id="rpaProd">'+prodOpts+'</select></div>'+
  '<div class="field"><label for="rpaPlat">Platform</label><select id="rpaPlat"><option value="instagram">Instagram</option><option value="facebook">Facebook</option></select></div>'+

function rpaInsights(rows){
 const wrap=b=>'<section class="panel" style="margin-bottom:14px"><h3 style="margin-top:0">Analysis &amp; next Reel recommendations</h3>'+b+'</section>';
 if(rows.length<3)return wrap('<p class="muted">'+(rows.length?'Only '+rows.length+' Reel tracked. ':'')+'Add at least 3 Reels with views and reach before patterns can be trusted — below that, any recommendation would be a guess.</p>');
 const best=(k,min=1)=>[...rows].filter(r=>r[k]>=min).sort((a,b)=>b[k]-a[k])[0];
 const L=[];
 const bv=best('views');if(bv)L.push('<b>Most viewed:</b> '+esc(bv.title)+' — '+rpaFmt(bv.views)+' views.');
 const be=best('er',0.0001);if(be)L.push('<b>Best engagement rate:</b> '+esc(be.title)+' — '+rpaP(be.er)+' (likes + comments + shares + saves ÷ reach).');
 const bs=best('saveRate',0.0001);if(bs)L.push('<b>Most saved:</b> '+esc(bs.title)+' — '+rpaP(bs.saveRate)+' save rate; saves signal buying intent, so repeat this style.');
 const bq=best('enq');if(bq)L.push('<b>Most enquiries:</b> '+esc(bq.title)+' — '+rpaFmt(bq.enq)+' enquiries.');
 const br=best('rev');if(br)L.push('<b>Highest revenue:</b> '+esc(br.title)+' — '+money(br.rev)+' from '+rpaFmt(br.sales)+' sale(s).');
 const hi=rows.filter(r=>r.views>=rows.reduce((a,x)=>a+x.views,0)/rows.length&&r.enq===0);
 if(hi.length)L.push('<b>Views but no enquiries:</b> '+hi.slice(0,3).map(r=>esc(r.title)).join('; ')+' — the Reel is being watched but the call-to-action is not working. Add a clear "DM / WhatsApp to order" line and price in the last scene.');
 const dn=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
 const byDay={};rows.forEach(r=>{(byDay[r.day]=byDay[r.day]||[]).push(r.er);});
 const dayAvg=Object.entries(byDay).filter(([,v])=>v.length>=2).map(([d,v])=>[d,v.reduce((a,b)=>a+b,0)/v.length,v.length]).sort((a,b)=>b[1]-a[1])[0];
 if(dayAvg)L.push('<b>Best posting day so far:</b> '+dn[dayAvg[0]]+' (avg engagement '+rpaP(dayAvg[1])+' across '+dayAvg[2]+' Reels). Small sample — treat as a hint.');
 const byProd={};rows.forEach(r=>{if(r.product!=='—'){const o=byProd[r.product]=byProd[r.product]||{v:0,e:0,s:0};o.v+=r.views;o.e+=r.enq;o.s+=r.sales;}});
 const topP=Object.entries(byProd).sort((a,b)=>(b[1].s*5+b[1].e*2+b[1].v/1000)-(a[1].s*5+a[1].e*2+a[1].v/1000))[0];
 const next=[];
 if(topP)next.push('Make the next Reel around <b>'+esc(topP[0])+'</b> (strongest mix of views, enquiries and sales so far), using the format of "'+esc((be||bv).title)+'".');
 next.push('Open with the hook of your best-engaging Reel in the first 2 seconds; keep the same length and music style.');
 next.push('End with a single call-to-action (WhatsApp / DM) and the price, to turn views into enquiries.');
 return wrap('<ul style="margin:0 0 12px;padding-left:18px;display:grid;gap:7px">'+L.map(x=>'<li>'+x+'</li>').join('')+'</ul><h4 style="margin:10px 0 6px">Recommended next Reel</h4><ul style="margin:0;padding-left:18px;display:grid;gap:7px">'+next.map(x=>'<li>'+x+'</li>').join('')+'</ul><p class="muted" style="margin-bottom:0">Rule-based analysis of your entered data; it updates automatically as you add Reels.</p>');
}

async function rpaSaveOne(d){
 // d: {title,productId,platform,postedAt(ISO),views,reach,likes,comments,shares,saves,enq,sales,rev}
 const s=window.__rpa;
 let post=(s.posts||[]).find(p=>(p.caption||'').trim().toLowerCase()===d.title.trim().toLowerCase()&&(p.tracking_code||'').startsWith('RL-'));
 if(!post){
  const row={caption:d.title,platforms:[d.platform],status:'published',scheduled_at:d.postedAt||new Date().toISOString(),tracking_code:'RL-'+Math.random().toString(36).slice(2,8).toUpperCase()};
  if(d.productId)row.product_id=d.productId;
  const r=await db.from('social_posts').insert(row).select('id,product_id,caption,platforms,status,scheduled_at,created_at,tracking_code').single();
  if(r.error)throw r.error;post=r.data;s.posts.unshift(post);
 }
 const m={views:d.views,reach:d.reach,impressions:d.views,likes:d.likes,comments:d.comments,shares:d.shares,saves:d.saves};
 if(d.views||d.reach||d.likes||d.comments||d.shares||d.saves){
  const ir=await db.from('social_post_insights').insert({post_id:post.id,platform:d.platform,external_post_id:post.tracking_code,...m,clicks:0,metrics:{source:'manual'},captured_at:new Date().toISOString()});
  if(ir.error){const l=rpaLocalGet();l[post.id]=m;rpaLocalSet(l);}
 }
 const evs=[];
 if(d.enq)evs.push({event_type:'enquiry',platform:d.platform,post_id:post.id,source:'manual',revenue:0,metadata:{count:d.enq,entered:'manual'}});
 if(d.sales||d.rev)evs.push({event_type:'order',platform:d.platform,post_id:post.id,source:'manual',revenue:d.rev,metadata:{count:d.sales||1,entered:'manual'}});

}

function rpaCsvFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{document.getElementById('rpaCsv').value=String(r.result||'');};r.readAsText(f);}
function rpaParseCsv(t){
 const out=[];let row=[],cur='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'&&t[i+1]==='"'){cur+='"';i++;}else if(c==='"')q=false;else cur+=c;}
  else if(c==='"')q=true;else if(c===','){row.push(cur);cur='';}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()))out.push(row);row=[];}
  else cur+=c;}
 row.push(cur);if(row.some(x=>x.trim()))out.push(row);return out;
}
async function rpaImport(){

 if(!h.includes('title')){toast('CSV needs a "title" column');return;}
 const ix=n=>h.indexOf(n);const pn={};(window.__rpa.prods||[]).forEach(p=>pn[p.name.trim().toLowerCase()]=p.id);
 let ok=0,bad=0;

  const v=n=>ix(n)>=0?(r[ix(n)]||'').trim():'';
  if(!v('title')){bad++;continue;}
  const pa=v('posted_at');let iso=null;if(pa){const x=new Date(pa.replace(' ','T')+(pa.length<=16?':00':'')+'+05:30');if(!isNaN(x))iso=x.toISOString();}
  const plat=/^f/i.test(v('platform'))?'facebook':'instagram';
  try{await rpaSaveOne({title:v('title'),productId:pn[v('product').toLowerCase()]||'',platform:plat,postedAt:iso,views:rpaNum(v('views')),reach:rpaNum(v('reach')),likes:rpaNum(v('likes')),comments:rpaNum(v('comments')),shares:rpaNum(v('shares')),saves:rpaNum(v('saves')),enq:rpaNum(v('enquiries')),sales:rpaNum(v('sales')),rev:rpaNum(v('revenue'))});ok++;}
  catch(e){bad++;}
 }
 toast('Imported '+ok+' Reel(s)'+(bad?' · '+bad+' skipped':''));await rpaLoad();
}

 function chooseVariant(p,text){

  if(intent==='return')return {text:T('ரிட்டர்ன்/எக்ஸ்சேஞ்ச் விதிகளை எங்கள் குழு உங்கள் ஆர்டர் பற்றிப் பார்த்து உறுதிப்படுத்தும். ஆர்டர் எண்ணைச் சொல்லுங்கள்.','Our team will check the return/exchange options for your order. Please share your order number.')};
  if(intent==='shop')return {text:T('கடை முகவரி மற்றும் நேரம் பற்றி எங்கள் குழு நேரடியாகச் சொல்லும். WhatsApp-இல் கேளுங்கள்.','Our team will share the store address and timings directly. Please ask us on WhatsApp.')};

  // product context
  let found=findProducts(text);

  }

   const cs=[...new Set(pool.map(v=>v.color).filter(Boolean))],ss=[...new Set(pool.map(v=>v.size).filter(Boolean))];

  // stock / general product question

/* =====================================================================
   WHATSAPP REPLY ASSISTANT — key-free. Paste a customer's WhatsApp message, get a human-style reply from live stock.
===================================================================== */
let rwaSes=null,rwaLast=null,rwaLog=[];
async function rwaCatalog(){
 const {data,error}=await db.from('products').select('id,name,brand,description,categories(name),product_variants(id,size,color,selling_price,mrp,is_active,stock_levels(quantity))').eq('status','active').limit(500);
 if(error)throw error;
 let phone='';try{const w=await db.from('whatsapp_settings').select('phone_number').limit(1).maybeSingle();phone=w.data?.phone_number||'';}catch(e){}
 return {phone,products:(data||[]).map(p=>({id:p.id,name:p.name,category:p.categories?.name||'',brand:p.brand||'',description:p.description||'',variants:(p.product_variants||[]).filter(v=>v.is_active!==false).map(v=>{const sl=v.stock_levels;const q=Array.isArray(sl)?sl.reduce((a,x)=>a+Number(x.quantity||0),0):Number(sl?.quantity||0);return {id:v.id,size:v.size||'',color:v.color||'',price:Number(v.selling_price)||0,mrp:Number(v.mrp)||0,qty:q};})})).filter(p=>p.variants.length)};
}
function rwaPanelHTML(){
 return panel(`<h3 style="margin:0 0 4px">WhatsApp Reply Assistant 💬</h3><p class="muted" style="margin:0 0 10px">No API key needed. Paste the customer's WhatsApp message; the reply is written from your live products, colours, sizes and stock. Copy it and send from WhatsApp.</p>
 <div class="field"><label for="rwaIn">Customer message</label><textarea id="rwaIn" placeholder="e.g. red shirt irukka? / இந்த புடவை ஸ்டாக்ல இருக்கா?"></textarea></div>
 <div class="field" style="margin-top:8px"><label for="rwaPhone">Customer WhatsApp number (optional, for the Send button)</label><input id="rwaPhone" placeholder="10-digit number"></div>
 <div class="admin-actions"><button class="btn dark" onclick="rwaSuggest()">Suggest reply</button><button class="btn outline" onclick="rwaReset()">New customer</button></div>
 <div id="rwaOut" style="margin-top:12px"></div>`);
}
async function rwaSuggest(){
 const inp=document.getElementById('rwaIn'),out=document.getElementById('rwaOut');const t=(inp?.value||'').trim();if(!t){toast('Paste the customer message first');return;}
 try{
  if(!rwaSes||!rwaSes.__fresh){out.innerHTML='<p class="muted">Reading live stock…</p>';rwaSes=window.ShafAI.create(await rwaCatalog());rwaSes.__fresh=Date.now();}
  const r=rwaSes.reply(t);rwaLast=r;rwaLog.push({c:t,a:r.text});
  const ph=(document.getElementById('rwaPhone')?.value||'').replace(/\D/g,'');const n=ph.length===10?'91'+ph:ph;

  out.innerHTML='<div class="notice" style="background:#eef8f1;color:#1d5a3a;white-space:pre-wrap">'+esc(r.text)+'</div><div class="admin-actions"><button class="btn outline" onclick="rwaCopy()">Copy reply</button>'+(wa?'<a class="btn" target="_blank" rel="noopener" href="'+esc(wa)+'">Send on WhatsApp</a>':'')+'<button class="btn outline" onclick="rwaRefresh()">Refresh stock</button></div>'+
   (r.action&&r.action.type==='whatsapp'?'<p class="muted">Customer order is ready: the customer can send it to the store WhatsApp, or you can place it in POS / Online Orders.</p>':'');

 }catch(e){out.innerHTML='<p class="danger">'+safeErr(e)+'</p>';}
}
function rwaCopy(){if(!rwaLast)return;const t=rwaLast.text;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Reply copied')).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Reply copied');}catch(e){toast('Copy failed');}a.remove();});}
function rwaReset(){rwaSes=null;rwaLast=null;rwaLog=[];const o=document.getElementById('rwaOut');if(o)o.innerHTML='';const i=document.getElementById('rwaIn');if(i)i.value='';toast('Ready for a new customer');}

async function makeUniqueProductSlug(name,excludeId=null){
 const base=slugify(name);
 const {data:rows,error}=await db.from('products').select('id,slug').like('slug',`${base}%`);
 if(error)throw error;
 const used=new Set((rows||[]).filter(x=>x.id!==excludeId).map(x=>x.slug));
 if(excludeId){
  const current=adminProducts.find(x=>x.id===excludeId);
  if(current&&String(current.name||'').trim().toLowerCase()===name.trim().toLowerCase()&&current.slug&&!used.has(current.slug))return current.slug;
 }
 let candidate=base,n=2;
 while(used.has(candidate)){candidate=`${base}-${n}`;n++;}
 return candidate;
}

// Manage existing product gallery entries. Admin-only UI; Storage and DB row are kept in sync.
async function manageProductPhotos(productId){
 if(!currentUser?.id) return toast('Admin sign-in required');
 try{
  const {data:profile,error:profileError}=await db.from('profiles').select('role,is_active').eq('id',currentUser.id).single();
  if(profileError||!profile||profile.role!=='admin'||profile.is_active!==true) throw new Error('Active admin access required');
  const {data:images,error}=await db.from('product_images').select('id,image_url,storage_path,is_primary,position').eq('product_id',productId).order('position',{ascending:true});
  if(error) throw error;
  if(!images?.length){toast('No uploaded photos for this product');return;}
  const lines=images.map((im,i)=>`${i+1}. ${im.is_primary?'[PRIMARY] ':''}${im.image_url}`).join('\n');
  const choice=prompt('Uploaded photos:\n'+lines+'\n\nEnter photo number to DELETE, or type P<number> to set primary. Cancel to close.');
  if(choice===null)return;
  const match=choice.trim().match(/^([pP])?(\d+)$/);
  if(!match) throw new Error('Enter a photo number, e.g. 1 to delete or P1 to set primary.');
  const n=Number(match[2]); if(n<1||n>images.length) throw new Error('Photo number is out of range.');
  const selected=images[n-1];
  if(match[1]){
   const {error:clearErr}=await db.from('product_images').update({is_primary:false}).eq('product_id',productId);
   if(clearErr)throw clearErr;
   const {error:setErr}=await db.from('product_images').update({is_primary:true}).eq('id',selected.id);
   if(setErr)throw setErr;
   toast('Primary photo updated'); await loadProducts(); adminPage('products'); return;
  }
  if(images.length===1) throw new Error('Keep at least one product photo. Upload another photo before deleting this one.');
  if(!confirm('Delete this photo permanently? This removes its gallery record and stored file.'))return;
  const path=selected.storage_path || (()=>{try{const u=new URL(selected.image_url);const marker='/object/public/product-images/';const at=u.pathname.indexOf(marker);return at>=0?decodeURIComponent(u.pathname.slice(at+marker.length)):null;}catch(_){return null;}})();
  const {error:rowErr}=await db.from('product_images').delete().eq('id',selected.id);
  if(rowErr)throw rowErr;
  if(path){
   const {error:storageErr}=await db.storage.from('product-images').remove([path]);
   if(storageErr) console.warn('Photo record deleted; storage cleanup needs retry:',storageErr.message);
  }
  if(selected.is_primary){
   const next=images.find(x=>x.id!==selected.id);
   if(next){const {error:primaryErr}=await db.from('product_images').update({is_primary:true}).eq('id',next.id);if(primaryErr)throw primaryErr;}
  }
  toast('Photo deleted'); await loadProducts(); adminPage('products');
 }catch(e){toast(e.message||String(e));}
}

e" onclick="saveStaffProfile('${p.id}')">Save</button> <button class="btn outline" onclick="resetStaffPassword('${p.id}')">Reset password</button> <button class="btn danger" onclick="deactivateStaffAccount('${p.id}')">Deactivate</button></td></tr>`).join('')||tableEmpty(6)}</tbody></table></div><p class="muted">Up to 10 active staff logins are supported in this screen. Deactivate a staff login to remove access; its historical records remain preserved. Passwords are never displayed.</p>`);}catch(e){root.innerHTML=adminHead('Staff Management')+panel(`<p class="danger">${safeErr(e)}</p>`);}}

}

 const sub=posCart.reduce((n,x)=>n+x.price*x.qty,0),disc=Math.max(0,Number(document.getElementById('posDiscount')?.value||0)),total=Math.max(0,sub-Math.min(disc,sub));

function addPOSVariant(variantId){const p=adminProducts.find(x=>x.variants.some(v=>v.id===variantId));const v=p?.variants.find(x=>x.id===variantId);if(!v)return;let x=posCart.find(i=>i.variant_id===variantId);if(x){if(x.qty>=v.stock_quantity)return toast('Insufficient stock');x.qty++;}else posCart.push({id:p.id,variant_id:v.id,name:p.name+(v.size?' · '+v.size:'')+(v.color?' · '+v.color:''),price:Number(v.selling_price),qty:1,stock:Number(v.stock_quantity)});renderPOSCart();}
function addPOSCombo(comboId){const c=posActiveCombos.find(x=>x.id===comboId);if(!c)return;const available=comboAvailableQty(c);let x=posCart.find(i=>i.combo_kit_id===comboId);if(x){if(x.qty>=available)return toast('Not enough component stock for another combo');x.qty++;}else{if(available<1)return toast('This combo is currently out of stock');posCart.push({id:c.id,combo_kit_id:c.id,combo_code:c.combo_code,name:c.name,price:Number(c.selling_price),qty:1,stock:available,components:(c.combo_kit_items||[]).map(i=>({variant_id:i.variant_id,quantity:Number(i.quantity)}))});}renderPOSCart();}
function posComboQty(id,d){const x=posCart.find(i=>i.combo_kit_id===id);if(!x)return;const c=posActiveCombos.find(c=>c.id===id),available=c?comboAvailableQty(c):0;x.qty+=d;if(x.qty<=0)posCart=posCart.filter(i=>i!==x);else if(x.qty>available){x.qty=available;toast('Component stock limit reached');}renderPOSCart();}
function posQty(id,d){const x=posCart.find(i=>i.variant_id===id);if(!x)return;x.qty+=d;if(x.qty<=0)posCart=posCart.filter(i=>i!==x);if(x&&x.qty>x.stock){x.qty=x.stock;toast('Stock limit reached');}renderPOSCart();}
function removePOSLine(index){posCart.splice(index,1);renderPOSCart();}
function buildPOSExpansion(){
 const map=new Map(),comboSales=[];let comboSavings=0,comboMarkup=0;
 for(const line of posCart){
  if(line.combo_kit_id){
   const combo=posActiveCombos.find(c=>c.id===line.combo_kit_id);if(!combo)throw new Error('Combo is no longer active. Refresh the POS and add it again.');
   const available=comboAvailableQty(combo);if(line.qty>available)throw new Error(`Not enough stock for combo ${combo.combo_code}. Available ${available}.`);
   let componentRetail=0;
   for(const item of combo.combo_kit_items||[]){const p=adminProducts.find(p=>p.variants.some(v=>v.id===item.variant_id)),v=p?.variants.find(v=>v.id===item.variant_id);if(!v||!v.is_active&&v.is_active!==undefined)throw new Error('A combo component is no longer active.');const q=Number(item.quantity)*line.qty;componentRetail+=Number(v.selling_price)*q;const old=map.get(item.variant_id)||{variant_id:item.variant_id,quantity:0,price:Number(v.selling_price)};old.quantity+=q;map.set(item.variant_id,old);}
   const saving=componentRetail-(Number(combo.selling_price)*line.qty);if(saving>=0)comboSavings+=saving;else comboMarkup+=(-saving);
   comboSales.push({combo_kit_id:combo.id,combo_code:combo.combo_code,name:combo.name,quantity:line.qty,selling_price:Number(combo.selling_price),components:(combo.combo_kit_items||[]).map(i=>({variant_id:i.variant_id,quantity:Number(i.quantity)}))});
  }else{const old=map.get(line.variant_id)||{variant_id:line.variant_id,quantity:0,price:Number(line.price)};old.quantity+=Number(line.qty);map.set(line.variant_id,old);}
 }
 const items=[...map.values()].sort((a,b)=>String(a.variant_id).localeCompare(String(b.variant_id)));
 const gross=items.reduce((n,x)=>n+x.price*x.quantity,0);
 return {items,gross,comboSavings,comboMarkup,comboSales};
}

async function completePOS(){
 if(!posCart.length)return toast('Add at least one item');

let posCheckoutBusy=false;
async function confirmPOSCheckout(){
 if(posCheckoutBusy)return;
 posCheckoutBusy=true;
 const confirmButton=document.querySelector('#shafBillModal button[onclick="confirmPOSCheckout()"]');
 if(confirmButton){confirmButton.disabled=true;confirmButton.textContent='Saving sale…';}
 try{
  const subtotal=posCart.reduce((n,x)=>n+x.price*x.qty,0),manualDiscount=Number(document.getElementById('posDiscount')?.value||0);if(manualDiscount<0||manualDiscount>subtotal)throw new Error('Discount cannot exceed subtotal.');
  const expanded=buildPOSExpansion(),effectiveDiscount=Math.round((manualDiscount+expanded.comboSavings)*100)/100;if(effectiveDiscount>expanded.gross)throw new Error('Total combo and bill discount is greater than the component value.');
  const customer=document.getElementById('posCustomer')?.value||'Walk-in customer',phone=document.getElementById('posPhone')?.value||'',method=document.getElementById('posPayment')?.value||'cash';
  const {data:cfg,error:cfgErr}=await db.from('business_settings').select('is_gst_registered,prices_include_gst').eq('id',true).maybeSingle();if(cfgErr)throw cfgErr;
  let taxTotal=0,discountLeft=effectiveDiscount,idx=0;
  if(cfg?.is_gst_registered&&expanded.comboMarkup>0)throw new Error('This combo price is above its component total. For GST-registered billing, reduce the combo price to the component total or below.');
  if(cfg?.is_gst_registered){for(const line of expanded.items){const v=adminProducts.flatMap(p=>p.variants).find(v=>v.id===line.variant_id);if(!v)throw new Error('A product variant could not be found. Refresh and try again.');const lineGross=Math.round(line.price*line.quantity*100)/100;idx++;const lineDiscount=idx===expanded.items.length?discountLeft:Math.min(Math.round(effectiveDiscount*lineGross/expanded.gross*100)/100,discountLeft);discountLeft-=lineDiscount;const net=lineGross-lineDiscount,rate=Number(v.gst_rate||0);let tax=0;if(cfg.prices_include_gst){const taxable=Math.round(net/(1+rate/100)*100)/100;tax=net-taxable;}else tax=Math.round(net*rate/100*100)/100;taxTotal+=tax;}}

      dashboard: renderDashboard,
      staffDashboard: renderStaffDashboard,
      products: renderAdminProducts,
      productForm: renderProductForm,
      categories: renderCategories,
      sku: renderSkuVariants,
      combo: renderComboBuilder,
      inventory: renderInventory,

      delivery: renderDelivery,
      reports: renderReports,
      reels: renderReelGenerator,
      ai: renderAI,
      staff: renderStaff,
      settings: renderSettings,
      apiManagement: renderApiManagement

    const render = routes[page];

      root.innerHTML = '<section class="panel"><h2>Module unavailable</h2><p>This module is not connected in the current HTML build.</p></section>';
      return;
    }
    return render(root);
  };

  // Re-add the original AI Business Partner chat alongside the QC AI task board.
  const originalRenderAI = window.renderAI;
  window.renderAI = async function (root) {

    if (root && !root.querySelector('.ai-chat-shell') && typeof aiChatPanelHTML === 'function') {
      root.insertAdjacentHTML('afterbegin', aiChatPanelHTML());
    }
  };

  // Make the storefront theme setting deterministic: legacy "daily" becomes
  // the requested 10–15 second auto-rotation, while explicit manual stays manual.
  window.loadStorefrontTheme = async function () {
    let value = null;
    try {
      const result = await db.from('app_settings').select('value').eq('key', 'storefront_theme').maybeSingle();
      if (result.error) throw result.error;
      value = result.data && result.data.value ? result.data.value : null;
    } catch (err) {
      console.warn('Store theme could not be loaded from Supabase; checking this device.', err);

    }

<script>
/* Public storefront inventory adapter: anonymous users read stock only through the existing safe RPC. */

window.fetchNormalizedProducts = async function (activeOnly) {
  activeOnly = !!activeOnly;

  // Keep the existing authenticated Admin data path unchanged.
  if (!activeOnly) {
    const result = await db.from('products')
      .select('*,categories(name),product_variants(id,sku,barcode,size,color,selling_price,mrp,gst_rate,hsn_code,is_active,variant_costs(purchase_cost,minimum_selling_price),stock_levels(quantity)),product_images(image_url,is_primary,position),product_details(highlights,fabric,wash_care),product_showcase_videos(id,video_url,poster_url,duration_seconds,position)')
      .order('created_at', { ascending: false });

    if (result.error) throw result.error;
    return (result.data || []).map(normalizeProduct);
  }

  // Public storefront: do not request protected stock_levels directly.
  const result = await db.from('products')
    .select('*,categories(name),product_variants(id,sku,barcode,size,color,selling_price,mrp,gst_rate,hsn_code,is_active)')
    .eq('status', 'active')
    .order('created_at', { ascending: false });

  if (result.error) throw result.error;

  const rows = result.data || [];
  const productIds = rows.map(p => p.id);

  if (!productIds.length) return [];

  // Load public product information separately.
  const [images, details, videos, stock] = await Promise.all([
    db.from('product_images')
      .select('product_id,image_url,is_primary,position')
      .in('product_id', productIds),
    db.from('product_details')
      .select('product_id,highlights,fabric,wash_care')
      .in('product_id', productIds),
    db.from('product_showcase_videos')
      .select('product_id,id,video_url,poster_url,duration_seconds,position')
      .in('product_id', productIds),
    db.rpc('storefront_stock')
  ]);

  if (images.error) throw images.error;
  if (details.error) throw details.error;
  if (videos.error) throw videos.error;
  if (stock.error) throw stock.error;

  const imageMap = {};
  (images.data || []).forEach(x => {
    (imageMap[x.product_id] ||= []).push(x);
  });

  const detailMap = {};
  (details.data || []).forEach(x => {
    (detailMap[x.product_id] ||= []).push(x);
  });

  const videoMap = {};
  (videos.data || []).forEach(x => {
    (videoMap[x.product_id] ||= []).push(x);
  });

  const stockMap = {};
  (stock.data || []).forEach(x => {
    stockMap[String(x.variant_id)] = Number(x.quantity || 0);
  });

  const normalized = rows.map(product => {
    const variants = (product.product_variants || []).map(variant => ({
      ...variant,
      stock_levels: [{
        quantity: stockMap[String(variant.id)] || 0
      }]
    }));

    return normalizeProduct({
      ...product,
      product_variants: variants,
      product_images: imageMap[product.id] || [],
      product_details: detailMap[product.id] || [],
      product_showcase_videos: videoMap[product.id] || []
    });
  });

  return normalized.filter(product =>
    (product.variants || []).some(variant =>
      Number(variant.selling_price) > 0
    )
  );
};

%%SL_END_SCRIPT%%>

window.loadReturnHistory = async function () {
  const host = document.getElementById('returnHistory');

  try {
    const result = await db.from('returns')
      .select('*,return_items(*),orders(order_number,customer_name,customer_phone)')

      (result.data || []).map(function (row) {
        const actions = ['approve', 'reject', 'receive', 'refund', 'complete']
          .map(function (action) { return '<option value="' + action + '">' + action + '</option>'; }).join('');
        return `<tr><td>${fmtDate(row.created_at)}</td><td>${esc(row.order_number || row.orders?.order_number || '')}</td>
          <td>${esc(row.orders?.customer_name || '')}<br>${esc(row.orders?.customer_phone || '')}</td>

      }).join('') || '<tr><td colspan="7">No return records found.</td></tr>' +
      '</tbody></table></div>';
  } catch (err) {
    host.innerHTML = '<p class="danger">' + safeErr(err) + '</p>';
  }

window.processReturn = async function (id, action) {
  if (!action) return;
  let method = 'other';
  if (action === 'refund') {
    method = (prompt('Refund method: cash / upi / card / bank_transfer / other', 'upi') || 'upi').trim();
    if (!['cash', 'upi', 'card', 'bank_transfer', 'other'].includes(method)) {
      return toast('Choose a valid refund method.');
    }
  }
  const restock = action === 'receive' ? confirm('Restock the returned items if they are saleable?') : true;
  if (!confirm('Confirm ' + action + ' for this return?')) return;
  try {
    const result = await db.rpc('process_return', {
      p_return_id: id, p_action: action, p_refund_method: method, p_restock: restock
    });
    if (result.error) throw result.error;
    toast('Return updated');
    if (typeof adminPage === 'function') adminPage('returns');
    if (typeof loadReturnHistory === 'function') loadReturnHistory();
  } catch (err) {
    toast(err.message || String(err));
  }
};

  const days=Array.from({length:14},(_,i)=>{const d=new Date();d.setDate(d.getDate()-13+i);return d});const dayValues=days.map(d=>valid.filter(o=>new Date(o.created_at).toDateString()===d.toDateString()).reduce((s,o)=>s+num(o.grand_total),0));

 window.savePrice=async(id,oldPrice,minPrice=0)=>{if(!isOwner())return alert("Only the owner can change prices.");const field=$("price-"+id),price=Number(field.value);if(!Number.isFinite(price)||price<0)return alert("Enter a valid price.");if(price===oldPrice)return;if(minPrice>0&&price<minPrice)return alert("This is below the minimum selling price set for this variant ("+money(minPrice)+").");const reason=prompt("Reason for this price change (optional):","Owner price review");if(reason===null)return;const {error}=await db.rpc("bi_update_variant_price",{p_variant_id:id,p_new_price:price,p_reason:reason});if(error){alert("Price not changed: "+error.message);return;}await loadData();alert("Selling price updated. The change was recorded in price history.");};

<script>
/* APP BOOT — admin/staff (#admin, #/admin, #/staff) and owner insights (#/insights)
   are complete apps stored as inert text below. They only run when their route is opened,
   replacing this document, so customers never execute dashboard code. */
(function(){
  var m=window.__SL_MODE;if(m==="store")return;
  function go(){
    var h=(location.hash||"").toLowerCase();
    if(m==="admin"&&/^#\/(admin|staff)/.test(h))history.replaceState(null,"",location.pathname+location.search+"#admin");
    var el=document.getElementById(m==="admin"?"sl-admin":"sl-insights");
    var src=el.textContent.split("%%SL_END_SCRIPT%%").join("</scr"+"ipt").split("%%SL_CMT%%").join("<!"+"--");
    // Parse the app, swap it in, then run its scripts in order (external ones wait for load).
    var doc=new DOMParser().parseFromString(src,"text/html"),root=document.documentElement;
    var list=Array.prototype.slice.call(doc.querySelectorAll("script"));
    list.forEach(function(s){s.parentNode.removeChild(s)});
    while(root.attributes.length)root.removeAttribute(root.attributes[0].name);
    Array.prototype.forEach.call(doc.documentElement.attributes,function(a){root.setAttribute(a.name,a.value)});
    document.head.replaceWith(document.importNode(doc.head,true));
    document.body.replaceWith(document.importNode(doc.body,true));
    window.scrollTo(0,0);
    (function next(i){
      if(i>=list.length){document.dispatchEvent(new Event("DOMContentLoaded"));window.dispatchEvent(new Event("load"));return}
      var o=list[i],s=document.createElement("script");
      Array.prototype.forEach.call(o.attributes,function(a){s.setAttribute(a.name,a.value)});
      if(o.src){s.onload=s.onerror=function(){next(i+1)};document.body.appendChild(s)}
      else{s.textContent=o.textContent;document.body.appendChild(s);next(i+1)}
    })(0);
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",go,{once:true});else go();
})();
</script>
