function decodeHtml(b64){const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(bytes)}
const customerFrame=document.getElementById('customerFrame');
const adminFrame=document.getElementById('adminFrame');
let adminLoaded=false;
customerFrame.srcdoc=decodeHtml(CUSTOMER_B64);
function openAdmin(){if(!adminLoaded){adminFrame.srcdoc=decodeHtml(ADMIN_B64);adminLoaded=true;}customerFrame.style.display='none';adminFrame.style.display='block';}
function backToStore(){adminFrame.style.display='none';customerFrame.style.display='block';}
window.addEventListener('message',e=>{if(e.source!==customerFrame.contentWindow)return;if(e.data&&e.data.type==='SHAFLIVS_OPEN_ADMIN')openAdmin();});
window.addEventListener('message',e=>{if(e.source!==adminFrame.contentWindow)return;if(e.data&&e.data.type==='SHAFLIVS_BACK_TO_STORE')backToStore();});
</script></body></html>
