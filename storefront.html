<script>
(function(){
"use strict";
const SUPABASE_URL="https://acxhrvrnemkpgzrozlqd.supabase.co";
const SUPABASE_KEY="sb_publishable_PMrmFM8XhEJ8qx0CcmpfWA_U2V3RdFq";
const $=s=>document.querySelector(s);
const app=$("#app");
let state={combos:[],products:[],categories:[],whatsapp:"",loading:true,error:"",cart:readCart(),search:""};
const money=n=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:0}).format(Number(n)||0);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>{try{const x=new URL(u,location.origin);return ["https:","http:"].includes(x.protocol)?x.href:""}catch{return ""}};
function readCart(){try{return JSON.parse(localStorage.getItem("shaflivs_cinematic_cart")||"{}")}catch{return {}}}
function saveCart(){localStorage.setItem("shaflivs_cinematic_cart",JSON.stringify(state.cart));updateBagCount()}
function updateBagCount(){const n=Object.values(state.cart).reduce((a,x)=>a+(Number(x.qty)||0),0);$("#bagCount").textContent=n}
function toast(s){const el=$("#toast");el.textContent=s;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2400)}
async function api(path,options){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),10000);try{const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...options,signal:controller.signal,headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json",...(options&&options.headers||{})}});if(!r.ok){let m="Request failed ("+r.status+")";try{const j=await r.json();m=j.message||j.error||m}catch{}throw new Error(m)}return await r.json()}catch(e){if(e.name==="AbortError")throw new Error("The store took too long to respond. Please retry.");throw e}finally{clearTimeout(timer)}}
async function rpc(name,args){return api("rpc/"+name,{method:"POST",body:JSON.stringify(args||{})})}
async function optional(p,fallback){try{return await p}catch{return fallback}}
async function loadStore(){
 state.loading=true;state.error="";renderLoading();
 try{
  const [categories,products,variants,images,stock,details,combos,comboItems,comboMedia,videos,whatsapp]=await Promise.all([
   optional(api("categories?select=id,name,slug,image_url,sort_order,is_active&is_active=eq.true&order=sort_order.asc"),[]),
   api("products?select=id,name,slug,category_id,description,brand,status,is_featured&status=eq.active&order=created_at.desc"),
   api("product_variants?select=id,product_id,size,color,selling_price,mrp,is_active&is_active=eq.true"),
   optional(api("product_images?select=id,product_id,image_url,alt_text,position,is_primary&order=position.asc"),[]),
   optional(rpc("storefront_stock",{}),[]),
   optional(api("product_details?select=product_id,highlights,fabric,wash_care"),[]),
   optional(api("combo_kits?select=id,name,description,combo_code,selling_price,mrp,is_active&is_active=eq.true&order=created_at.desc"),[]),
   optional(api("combo_kit_items?select=id,combo_kit_id,variant_id,quantity"),[]),
   optional(api("combo_kit_media?select=id,combo_kit_id,media_type,media_url,position,alt_text&order=position.asc"),[]),
   optional(api("product_showcase_videos?select=id,product_id,video_url,poster_url,duration_seconds,position&order=position.asc"),[]),
   optional(rpc("storefront_whatsapp_contact",{}),null)
  ]);
  const stockMap=new Map((stock||[]).map(x=>[x.variant_id,Number(x.quantity)||0]));
  const imageMap=new Map(),detailMap=new Map(),videoMap=new Map(),variantMap=new Map();
  (images||[]).forEach(x=>{if(!imageMap.has(x.product_id))imageMap.set(x.product_id,[]);imageMap.get(x.product_id).push(x)});
  (details||[]).forEach(x=>detailMap.set(x.product_id,x));
  (videos||[]).forEach(x=>{if(!videoMap.has(x.product_id))videoMap.set(x.product_id,[]);videoMap.get(x.product_id).push(x)});
  (variants||[]).forEach(x=>{if(!variantMap.has(x.product_id))variantMap.set(x.product_id,[]);variantMap.get(x.product_id).push({...x,stock:stockMap.get(x.id)||0})});
  state.products=(products||[]).map(p=>({...p,images:(imageMap.get(p.id)||[]).sort((a,b)=>Number(b.is_primary)-Number(a.is_primary)||a.position-b.position).map(x=>safeUrl(x.image_url)).filter(Boolean),details:detailMap.get(p.id)||{},videos:videoMap.get(p.id)||[],variants:variantMap.get(p.id)||[]}));
  const productById=new Map(state.products.map(p=>[p.id,p]));
  const variantById=new Map();state.products.forEach(p=>p.variants.forEach(v=>variantById.set(v.id,{product:p,variant:v})));
  const mediaMap=new Map();(comboMedia||[]).forEach(x=>{if(!mediaMap.has(x.combo_kit_id))mediaMap.set(x.combo_kit_id,[]);mediaMap.get(x.combo_kit_id).push(x)});
  state.combos=(combos||[]).map(c=>{
   const items=(comboItems||[]).filter(x=>x.combo_kit_id===c.id).map(x=>{const hit=variantById.get(x.variant_id);return hit?{product:hit.product,variant:hit.variant,quantity:Number(x.quantity)||1}:null}).filter(Boolean);
   const stockQty=items.length?Math.min(...items.map(x=>Math.floor(x.variant.stock/Math.max(1,x.quantity)))):0;
   const media=(mediaMap.get(c.id)||[]).sort((a,b)=>a.position-b.position).filter(x=>safeUrl(x.media_url));
   const images=media.filter(x=>x.media_type==="image").map(x=>safeUrl(x.media_url));
   const video=media.find(x=>x.media_type==="video")||items.flatMap(x=>x.product.videos).find(x=>x.video_url);
   const componentImages=items.flatMap(x=>x.product.images).filter(Boolean);
   const mrp=Number(c.mrp)||items.reduce((sum,x)=>sum+(Number(x.variant.mrp)||Number(x.variant.selling_price))*x.quantity,0);
   return {...c,items,stock:stockQty,images:images.length?images:componentImages,video:video?safeUrl(video.media_url||video.video_url):"",mrp};
  }).filter(c=>c.items.length>0);
  state.categories=categories||[];
  state.whatsapp=whatsapp&&whatsapp.phone_number?String(whatsapp.phone_number).replace(/\D/g,""):"";
  state.loading=false;render();
 }catch(e){state.loading=false;state.error=e.message||"Could not load the store.";renderError()}
}

function renderError(){app.innerHTML='<section class="page wrap"><div class="error"><p class="eyebrow">Connection interrupted</p><h2>We could not load the collection</h2><p>'+esc(state.error)+' Your cart stays saved on this device. Please try again.</p><button class="btn" id="retry">Try Again</button></div></section>';$("#retry").onclick=loadStore}
function heroImage(){const c=state.combos.find(x=>x.images.length);if(c)return c.images[0];const p=state.products.find(x=>x.images.length);return p?p.images[0]:""}
function comboCard(c,i){const image=c.images[0]||"";return '<article class="combo-card reveal"><a href="#/combo/'+encodeURIComponent(c.id)+'" aria-label="Explore '+esc(c.name)+' combo"><div class="combo-image">'+(image?'<img src="'+esc(image)+'" alt="'+esc(c.name)+' complete combo" loading="lazy" decoding="async">':'')+'<span class="combo-tag">Complete combo · '+String(i+1).padStart(2,"0")+'</span></div></a><div class="combo-info"><h3>'+esc(c.name)+'</h3><p>'+esc(c.description||c.items.map(x=>x.product.name).join(" · "))+'</p><div class="combo-bottom"><span class="price">'+money(c.selling_price)+(c.mrp>c.selling_price?'<del>'+money(c.mrp)+'</del>':'')+'</span><a class="text-link" href="#/combo/'+encodeURIComponent(c.id)+'">Explore the look ↗</a></div></div></article>'}

 const img=heroImage();const c=state.combos;
 return '<section class="hero"><div class="hero-media">'+(img?'<img src="'+esc(img)+'" alt="ShafLivs curated fashion combo" fetchpriority="high">':'')+'</div><div class="wrap hero-copy"><span class="eyebrow">ShafLivs · Men’s style, considered</span><h1 class="serif">The complete<br><em>look.</em></h1><p>Thoughtfully brought together. Discover coordinated fashion combos designed to make getting dressed feel effortless.</p><div class="hero-cta"><a class="btn" href="#/combos">Explore Combo Collections <span>↗</span></a><a class="btn secondary" href="#/about">Discover ShafLivs</a></div></div><span class="hero-index">01 — THE COLLECTION</span></section><div class="marquee"><span>One choice. A complete look.</span>✳<span>Curated for everyday confidence</span>✳<span>ShafLivs · Tamil Nadu</span></div><section class="section wrap" id="collections"><div class="section-head"><div><span class="eyebrow">The edit · Complete looks</span><h2 class="serif">Combo collections</h2></div><p>Every piece has its place. Explore the full look, see each detail, and choose the combo that feels like you.</p></div>'+(c.length?'<div class="combo-grid">'+c.map(comboCard).join("")+'</div>':'<div class="empty"><span class="eyebrow">First collection in preparation</span><h2>Something good is coming.</h2><p>Our first ShafLivs combos are being put together. The complete looks will appear here as soon as the collection is ready.</p><a class="btn secondary" href="#/contact">Get in touch</a></div>')+'</section><section class="story"><div class="story-inner"><div class="story-visual">'+(img?'<img src="'+esc(img)+'" alt="A closer look at ShafLivs fashion" loading="lazy">':'')+'</div><div class="story-copy"><span class="eyebrow">More than individual pieces</span><h2 class="serif">A look that<br><em>comes together.</em></h2><p>We bring the essentials together in one considered combo. Explore every item, inspect the details, choose your size, and order the complete look from wherever you are.</p><a href="#/combos" class="btn">Find your combo ↗</a></div></div></section><section class="section wrap"><div class="section-head"><div><span class="eyebrow">A simpler way to shop</span><h2 class="serif">See it. Feel sure.<br>Make it yours.</h2></div></div><div class="steps"><div class="step"><span class="step-no">01</span><h3>Explore</h3><p>Browse complete combos and discover what is included in every look.</p></div><div class="step"><span class="step-no">02</span><h3>Look closer</h3><p>Swipe through original product photos, zoom into details, and review the fit and fabric information.</p></div><div class="step"><span class="step-no">03</span><h3>Choose your look</h3><p>Select your available combo and send your order request. Our team confirms availability and delivery.</p></div></div></section>'+footer()}
function footer(){return '<footer class="footer"><div class="wrap"><div class="footer-grid"><div class="footer-brand"><a class="brand" href="#/">SHAFLIVS</a><p>Complete looks. Considered style.<br>Tamil Nadu, India.</p></div><div><h4>Explore</h4><a href="#/combos">Combo Collections</a><br><a href="#/cart">Your Bag</a></div><div><h4>House</h4><a href="#/about">Our Story</a><br><a href="#/contact">Contact</a></div><div><h4>Need help?</h4><a href="#/contact">WhatsApp & Support</a><br><a href="#/contact">Sizing & Orders</a><br><a href="#" id="adminFooter">Admin / Staff Login</a></div></div><div class="footer-bottom">© 2026 SHAFLIVS STORE OFFICIAL · TAMIL NADU, INDIA</div></div></footer>'}
function combosPage(){return '<section class="page wrap"><span class="eyebrow">The complete edit</span><h1 class="page-title">Combo collections</h1><p class="muted" style="font-size:12px;line-height:1.8;max-width:520px;margin-bottom:28px">Explore coordinated looks, see what is included, and discover the details before you choose.</p>'+(state.combos.length?'<div class="combo-grid">'+state.combos.map(comboCard).join("")+'</div>':'<div class="empty"><span class="eyebrow">Coming soon</span><h2>Our first combos are being prepared.</h2><p>There are no published combo collections yet. Please check back soon.</p><a class="btn secondary" href="#/">Back to home</a></div>')+'</section>'+footer()}
function comboPage(id){
 const c=state.combos.find(x=>x.id===id);if(!c)return '<section class="page wrap"><button class="back" onclick="location.hash=\'#/combos\'">← All combos</button><div class="empty"><h2>Combo not found</h2><p>This combo may no longer be available.</p><a class="btn" href="#/combos">Explore collections</a></div></section>'+footer();
 const imgs=c.images.length?c.images:c.items.map(x=>x.product.images[0]).filter(Boolean);
 const video=c.video?'<video controls playsinline preload="metadata" style="width:100%;margin-top:14px;background:#211d18" src="'+esc(c.video)+'"></video>':"";
 const contents=c.items.map(x=>'<div class="included-row">'+(x.product.images[0]?'<img src="'+esc(x.product.images[0])+'" alt="'+esc(x.product.name)+'" loading="lazy">':'<div></div>')+'<div><strong>'+esc(x.product.name)+'</strong><small>'+esc([x.variant.size,x.variant.color].filter(Boolean).join(" · ")||"Included in this combo")+' · Qty '+x.quantity+'</small>'+(x.product.details.fabric?'<small>Fabric: '+esc(x.product.details.fabric)+'</small>':'')+'</div></div>').join("");
 const disabled=c.stock<1;
 const storySteps=c.items.map((x,i)=>({image:x.product.images[0]||"",name:x.product.name,detail:[x.variant.size,x.variant.color,x.product.details.fabric].filter(Boolean).join(" · ")||"Included in the complete combo",description:x.product.description||"Explore the details of this piece, included as part of the complete look."}));
 const storySection=storySteps.length?'<section class="cinematic"><div class="wrap"><span class="eyebrow">A closer look · Scroll through the combo</span><h2 class="serif" style="font-size:clamp(36px,8vw,58px);margin:10px 0 22px">Every piece.<br><em>One complete look.</em></h2><div class="cinematic-layout"><div class="cinematic-stage"><img id="cinematicImage" src="'+esc(storySteps[0].image||imgs[0]||"")+'" alt="'+esc(storySteps[0].name)+'" loading="lazy"><div class="cinematic-caption"><small id="cinematicMeta">01 · '+esc(storySteps[0].detail)+'</small><strong id="cinematicName">'+esc(storySteps[0].name)+'</strong></div></div><div class="cinematic-steps">'+storySteps.map((x,i)=>'<article class="cinematic-step" data-story="'+i+'"><span class="step-no">'+String(i+1).padStart(2,"0")+'</span><h3>'+esc(x.name)+'</h3><p>'+esc(x.description)+'</p><p style="margin-top:10px;color:var(--bronze)">'+esc(x.detail)+'</p></article>').join("")+'</div></div></div></section>':"";
 return '<section class="page wrap"><button class="back" onclick="location.hash=\'#/combos\'">← All combo collections</button><div class="detail-grid"><div class="gallery"><div class="gallery-main" id="galleryMain">'+(imgs[0]?'<img id="mainImage" src="'+esc(imgs[0])+'" alt="'+esc(c.name)+' — view 1" fetchpriority="high">':'')+'<span class="zoom-hint">Tap to zoom ⤢</span></div><div class="thumbs">'+imgs.map((u,i)=>'<img src="'+esc(u)+'" alt="View '+(i+1)+' of '+esc(c.name)+'" class="'+(i===0?"active":"")+'" data-image="'+esc(u)+'" loading="lazy">').join("")+'</div>'+video+'</div><div class="detail-copy"><span class="eyebrow">ShafLivs · Complete combo</span><h1>'+esc(c.name)+'</h1><p class="desc">'+esc(c.description||"A coordinated collection, brought together as one complete look.")+'</p><div class="detail-price">'+money(c.selling_price)+(c.mrp>c.selling_price?'<del style="font-size:13px;color:var(--muted);margin-left:8px">'+money(c.mrp)+'</del>':'')+'</div><p class="muted" style="font-size:10px;line-height:1.7">'+(disabled?"Currently unavailable":"Availability: "+c.stock+" complete combo"+(c.stock===1?"":"s")+" ready")+'</p><div class="included"><span class="eyebrow" style="display:block;padding:18px 0 4px">Inside this combo</span>'+contents+'</div><div class="notice">Photos are shown from the product gallery. Actual colour may vary slightly by screen settings and lighting. Please review the details and size information before ordering.</div><div class="detail-cta"><span class="sticky-price">'+money(c.selling_price)+'</span><button class="btn" id="addCombo" '+(disabled?"disabled":"")+'>Add complete combo to bag ↗</button></div></div></div>'+storySection+'</section>'+footer();
}
function cartPage(){
 const lines=Object.entries(state.cart).map(([id,x])=>({c:state.combos.find(c=>c.id===id),qty:Number(x.qty)||1})).filter(x=>x.c);
 const total=lines.reduce((s,x)=>s+x.c.selling_price*x.qty,0);
 if(!lines.length)return '<section class="page wrap"><span class="eyebrow">Your selection</span><h1 class="page-title">Your bag</h1><div class="empty"><h2>Your bag is waiting.</h2><p>Explore the collection and add a complete ShafLivs combo to get started.</p><a class="btn" href="#/combos">Explore combos</a></div></section>'+footer();
 return '<section class="page wrap"><span class="eyebrow">Your selection</span><h1 class="page-title">Your bag</h1><div class="cart-list">'+lines.map(x=>'<article class="cart-line">'+(x.c.images[0]?'<img src="'+esc(x.c.images[0])+'" alt="'+esc(x.c.name)+'">':'<div></div>')+'<div><h3>'+esc(x.c.name)+'</h3><p>Complete combo · '+money(x.c.selling_price)+'</p><div class="qty"><button data-qty="'+esc(x.c.id)+'" data-step="-1" aria-label="Decrease quantity">−</button><span>'+x.qty+'</span><button data-qty="'+esc(x.c.id)+'" data-step="1" aria-label="Increase quantity">+</button></div></div><button class="text-link" data-remove="'+esc(x.c.id)+'">Remove</button></article>').join("")+'</div><div class="summary"><div class="summary-row"><span>Combo subtotal</span><strong>'+money(total)+'</strong></div><div class="summary-row"><span>Delivery</span><span>Confirmed by the shop</span></div><div class="summary-row total"><span>Total</span><strong>'+money(total)+'</strong></div><a href="#/checkout" class="btn" style="width:100%;margin-top:14px">Continue to checkout ↗</a></div></section>'+footer();
}
function checkoutPage(){
 const lines=Object.entries(state.cart).map(([id,x])=>({c:state.combos.find(c=>c.id===id),qty:Number(x.qty)||1})).filter(x=>x.c);
 const total=lines.reduce((s,x)=>s+x.c.selling_price*x.qty,0);
 if(!lines.length)return '<section class="page wrap"><div class="empty"><h2>Nothing to check out</h2><p>Your bag is empty. Add a complete combo first.</p><a class="btn" href="#/combos">Shop combos</a></div></section>'+footer();
 return '<section class="page wrap"><button class="back" onclick="location.hash=\'#/cart\'">← Back to bag</button><span class="eyebrow">Almost yours</span><h1 class="page-title">Delivery details</h1><div class="detail-grid"><form id="checkoutForm"><div class="form-grid"><div class="field"><label for="name">Full name *</label><input id="name" name="name" autocomplete="name" required maxlength="120"></div><div class="field"><label for="phone">Mobile number *</label><input id="phone" name="phone" autocomplete="tel" inputmode="tel" pattern="[0-9+() -]{10,20}" required maxlength="20"></div><div class="field full"><label for="address1">Address line 1 *</label><input id="address1" name="address1" autocomplete="address-line1" required maxlength="250"></div><div class="field full"><label for="address2">Address line 2</label><input id="address2" name="address2" autocomplete="address-line2" maxlength="250"></div><div class="field"><label for="city">City *</label><input id="city" name="city" autocomplete="address-level2" required maxlength="100"></div><div class="field"><label for="state">State *</label><input id="state" name="state" autocomplete="address-level1" value="Tamil Nadu" required maxlength="100"></div><div class="field"><label for="pin">PIN code *</label><input id="pin" name="pin" autocomplete="postal-code" inputmode="numeric" pattern="[0-9]{6}" required maxlength="6"></div><div class="field full"><label for="notes">Order note (optional)</label><textarea id="notes" name="notes" maxlength="500" placeholder="Any delivery or order note?"></textarea></div></div><div class="notice">No online payment is taken here. Your order request is saved first; the ShafLivs team confirms stock, delivery charges and payment with you on WhatsApp.</div><button class="btn" id="placeOrder" style="width:100%">Send order request ↗</button></form><aside><div class="summary"><span class="eyebrow">Your combo order</span>'+lines.map(x=>'<div class="summary-row"><span>'+esc(x.c.name)+' × '+x.qty+'</span><strong>'+money(x.c.selling_price*x.qty)+'</strong></div>').join("")+'<div class="summary-row total"><span>Total</span><strong>'+money(total)+'</strong></div></div></aside></div></section>'+footer();
}
function aboutPage(){return '<section class="page wrap"><span class="eyebrow">The ShafLivs point of view</span><h1 class="page-title">Dress like<br><em>you mean it.</em></h1><p class="muted" style="max-width:560px;font-size:13px;line-height:1.9">ShafLivs brings together thoughtful fashion choices in complete combinations. Our goal is to make it easier to find a look that feels right, understand every included piece, and shop with confidence.</p><div class="story" style="margin-top:34px"><div class="story-inner"><div class="story-visual">'+(heroImage()?'<img src="'+esc(heroImage())+'" alt="ShafLivs collection">':'')+'</div><div class="story-copy"><span class="eyebrow">Our promise</span><h2 class="serif">The whole look.<br>One simple choice.</h2><p>We want every customer to see the complete combination clearly — from the overall look to the details of each item — before placing an order.</p></div></div></div></section>'+footer()}
function contactPage(){return '<section class="page wrap"><span class="eyebrow">We are listening</span><h1 class="page-title">Talk to ShafLivs.</h1><p class="muted" style="font-size:12px;line-height:1.8;max-width:480px">Questions about a combo, sizing, delivery or an order? Send us a message and our team will help.</p><form id="contactForm" style="max-width:560px;margin-top:26px"><div class="form-grid"><div class="field"><label>Your name *</label><input name="name" required maxlength="120"></div><div class="field"><label>Mobile number *</label><input name="phone" required maxlength="20" inputmode="tel"></div><div class="field full"><label>Message *</label><textarea name="message" required maxlength="1000"></textarea></div></div><button class="btn" style="margin-top:16px">Send on WhatsApp ↗</button></form></section>'+footer()}
function render(){
 const route=location.hash.replace(/^#/,"")||"/";const bits=route.split("/").filter(Boolean);
 if(bits[0]==="combo"){app.innerHTML=comboPage(decodeURIComponent(bits[1]||""));wireCombo();wireCinematic()}
 else if(bits[0]==="combos")app.innerHTML=combosPage();
 else if(bits[0]==="cart"){app.innerHTML=cartPage();wireCart()}
 else if(bits[0]==="checkout"){app.innerHTML=checkoutPage();wireCheckout()}
 else if(bits[0]==="about")app.innerHTML=aboutPage();
 else if(bits[0]==="contact"){app.innerHTML=contactPage();wireContact()}
 else app.innerHTML=home();
 document.querySelectorAll("[data-nav]").forEach(a=>a.classList.toggle("active",a.dataset.nav===(bits[0]||"home")));
 document.querySelectorAll("[data-go]").forEach(a=>a.classList.toggle("active",a.dataset.go===location.hash||(!location.hash&&a.dataset.go==="#/")));
 updateBagCount();observeReveal();window.scrollTo({top:0,behavior:"instant"});
}
function observeReveal(){if(!("IntersectionObserver"in window)){document.querySelectorAll(".reveal").forEach(x=>x.classList.add("in"));return}const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.08});document.querySelectorAll(".reveal").forEach(x=>io.observe(x))}
function wireCombo(){
 const c=state.combos.find(x=>x.id===decodeURIComponent((location.hash.split("/")[2]||"")));
 const main=$("#mainImage");if(main){main.onclick=()=>openZoom(main.src);document.querySelectorAll(".thumbs img").forEach(t=>t.onclick=()=>{main.src=t.dataset.image;main.alt=t.alt;document.querySelectorAll(".thumbs img").forEach(x=>x.classList.remove("active"));t.classList.add("active")})}
 const btn=$("#addCombo");if(btn&&c)btn.onclick=()=>{const old=state.cart[c.id]||{qty:0};if(old.qty+1>c.stock)return toast("Only "+c.stock+" complete combo(s) available.");state.cart[c.id]={qty:old.qty+1};saveCart();toast("Complete combo added to your bag.");};
}
function wireCinematic(){const steps=document.querySelectorAll("[data-story]"),image=$("#cinematicImage"),name=$("#cinematicName"),meta=$("#cinematicMeta");if(!steps.length||!image)return;const items=state.combos.find(x=>x.id===decodeURIComponent(location.hash.split("/")[2]||""));if(!items)return;const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(!e.isIntersecting)return;const n=Number(e.target.dataset.story),it=items.items[n];if(!it)return;const src=it.product.images[0];if(src&&image.src!==src){image.style.opacity=".25";setTimeout(()=>{image.src=src;image.style.opacity="1"},120)}name.textContent=it.product.name;meta.textContent=String(n+1).padStart(2,"0")+" · "+[it.variant.size,it.variant.color,it.product.details.fabric].filter(Boolean).join(" · ")}),{rootMargin:"-38% 0px -38% 0px",threshold:0});steps.forEach(s=>io.observe(s))}
function wireCart(){document.querySelectorAll("[data-qty]").forEach(b=>b.onclick=()=>{const id=b.dataset.qty,step=Number(b.dataset.step),c=state.combos.find(x=>x.id===id),n=(state.cart[id]?.qty||0)+step;if(n<=0)delete state.cart[id];else if(c&&n<=c.stock)state.cart[id]={qty:n};else return toast("Maximum available quantity is "+(c?c.stock:0));saveCart();render()});document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{delete state.cart[b.dataset.remove];saveCart();render()})}
async function wireCheckout(){const form=$("#checkoutForm");if(!form)return;form.onsubmit=async e=>{e.preventDefault();const btn=$("#placeOrder");btn.disabled=true;btn.textContent="Saving your order…";const f=new FormData(form),name=String(f.get("name")||"").trim(),phone=String(f.get("phone")||"").trim(),notes=String(f.get("notes")||"").trim();const items=[];Object.entries(state.cart).forEach(([id,x])=>{const c=state.combos.find(z=>z.id===id);if(c)c.items.forEach(it=>items.push({variant_id:it.variant.id,quantity:it.quantity*Number(x.qty)}))});const address={recipient_name:name,recipient_phone:phone,address_line1:String(f.get("address1")||"").trim(),address_line2:String(f.get("address2")||"").trim(),city:String(f.get("city")||"").trim(),state:String(f.get("state")||"").trim(),postal_code:String(f.get("pin")||"").trim(),country:"India"};try{const saved=await rpc("create_storefront_order_with_address",{p_items:items,p_customer_name:name,p_customer_phone:phone,p_notes:notes,p_shipping_address:address});const order=Array.isArray(saved)?saved[0]:saved;const msg="Hello ShafLivs Store! I have placed an order request.\\nOrder: "+(order.order_number||"")+".\\nName: "+name+"\\nPhone: "+phone+"\\n\\n"+Object.entries(state.cart).map(([id,x])=>{const c=state.combos.find(z=>z.id===id);return c?c.name+" × "+x.qty+" — "+money(c.selling_price*x.qty):""}).filter(Boolean).join("\\n")+"\\n\\nTotal: "+money(Object.entries(state.cart).reduce((s,[id,x])=>{const c=state.combos.find(z=>z.id===id);return s+(c?c.selling_price*x.qty:0)},0))+"\\nPlease confirm availability, delivery charge and payment.";const wa=state.whatsapp?"https://wa.me/"+state.whatsapp+"?text="+encodeURIComponent(msg):"https://wa.me/?text="+encodeURIComponent(msg);state.cart={};saveCart();app.innerHTML='<section class="page wrap"><div class="empty"><span class="eyebrow">Order request received</span><h2>Thank you. Your request is saved.</h2><p>Order reference: <strong>'+esc(order.order_number||"Pending confirmation")+'</strong><br>Our team will confirm availability, delivery and payment details with you.</p><a class="btn" href="'+esc(wa)+'" target="_blank" rel="noopener">Continue on WhatsApp ↗</a><p style="margin-top:14px"><a href="#/" class="text-link">Return to ShafLivs</a></p></div></section>'+footer();}catch(err){toast(err.message||"Could not save your order. Please try again.");btn.disabled=false;btn.textContent="Send order request ↗"}}}
function wireContact(){const form=$("#contactForm");if(form)form.onsubmit=e=>{e.preventDefault();const f=new FormData(form);const msg="Hello ShafLivs!\\nName: "+f.get("name")+"\\nPhone: "+f.get("phone")+"\\nMessage: "+f.get("message");const url=state.whatsapp?"https://wa.me/"+state.whatsapp+"?text="+encodeURIComponent(msg):"https://wa.me/?text="+encodeURIComponent(msg);window.open(url,"_blank","noopener");toast("Opening WhatsApp…")}}
function openZoom(src){$("#zoomImage").src=src;$("#zoom").classList.add("open");document.body.style.overflow="hidden"}
function closeZoom(){$("#zoom").classList.remove("open");document.body.style.overflow=""}
$("#zoomClose").onclick=closeZoom;$("#zoom").onclick=e=>{if(e.target.id==="zoom")closeZoom()};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeZoom()});
const openAdmin=()=>window.parent.postMessage({type:"SHAFLIVS_OPEN_ADMIN"},"*");const adminBtn=$("#adminBtn");if(adminBtn)adminBtn.onclick=openAdmin;const adminFooter=$("#adminFooter");if(adminFooter)adminFooter.onclick=e=>{e.preventDefault();openAdmin()};$("#bagBtn").onclick=()=>location.hash="#/cart";document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>location.hash=b.dataset.go);
$("#searchBtn").onclick=()=>{const bar=$("#searchBar");bar.style.display=bar.style.display==="none"?"block":"none";if(bar.style.display==="block")$("#searchInput").focus()};
$("#searchInput").oninput=e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll(".combo-card").forEach(card=>card.style.display=card.textContent.toLowerCase().includes(q)?"":"none")};
window.addEventListener("hashchange",render);window.addEventListener("scroll",()=>{const max=document.documentElement.scrollHeight-innerHeight;$("#progress").style.width=(max>0?scrollY/max*100:0)+"%"},{passive:true});
loadStore();
})();
</script>
